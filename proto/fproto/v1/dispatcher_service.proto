syntax = "proto3";

package fproto.v1;

option go_package = "github.com/qmish/FProto/server/internal/protocol/gen/fproto/v1";

import "fproto/v1/app_message.proto";

// DispatcherService -- gRPC API маршрутизации сообщений.
// Принимает AppMessage от Gateway, определяет Kafka topic и partition key
// на основе типа сообщения, записывает в Outbox для надёжной доставки.
// Поддерживает: chat (user-/group- topics), commands, media-events,
// sender keys, signaling. См. LLD §7.3.
service DispatcherService {
  // Маршрутизирует сообщение в соответствующий Kafka topic через Outbox.
  // Возвращает ack_message_id для подтверждения клиенту.
  rpc Dispatch(DispatchRequest) returns (DispatchResponse);
}

message DispatchRequest {
  bytes session_id = 1;
  bytes sender_id = 2;
  AppMessage message = 3;
}

message DispatchResponse {
  bool success = 1;
  bytes ack_message_id = 2;
}
