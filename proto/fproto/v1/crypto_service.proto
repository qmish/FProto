syntax = "proto3";

package fproto.v1;

option go_package = "github.com/qmish/FProto/server/internal/protocol/gen/fproto/v1";

// CryptoService -- gRPC API криптографических операций.
// Реализует Noise_XX_25519_ChaChaPoly_BLAKE2s handshake,
// шифрование/дешифрование сообщений (ChaCha20-Poly1305),
// и ротацию ключей (HKDF-SHA256). См. LLD §7.2.
service CryptoService {
  // Инициализирует Noise XX handshake. Возвращает handshake_state_id для последующих шагов.
  rpc InitiateHandshake(HandshakeInitRequest) returns (HandshakeInitResponse);

  // Обрабатывает следующий шаг handshake. При completed=true возвращает crypto_state.
  rpc ProcessHandshake(HandshakeStepRequest) returns (HandshakeStepResponse);

  // Шифрует plaintext с привязкой к session_id и seq (AEAD nonce = seq-based).
  rpc Encrypt(EncryptRequest) returns (EncryptResponse);

  // Дешифрует ciphertext. Проверяет AEAD тег и seq.
  rpc Decrypt(DecryptRequest) returns (DecryptResponse);

  // Выполняет ротацию ключей сессии (HKDF-SHA256 от текущего ключа).
  rpc Rekey(RekeyRequest) returns (RekeyResponse);
}

message HandshakeInitRequest {
  bytes session_id = 1;
  bool is_initiator = 2;
  bytes static_public_key = 3;
}

message HandshakeInitResponse {
  bytes handshake_state_id = 1;
}

message HandshakeStepRequest {
  bytes handshake_state_id = 1;
  bytes message_payload = 2;
}

message HandshakeStepResponse {
  bytes response_payload = 1;
  bool completed = 2;
  // Если handshake завершён, возвращается зашифрованное состояние сессии.
  bytes crypto_state = 3;
}

message EncryptRequest {
  bytes session_id = 1;
  bytes crypto_state = 2;
  uint64 seq = 3;
  bytes plaintext = 4;
}

message EncryptResponse {
  bytes ciphertext = 1;
  bytes updated_crypto_state = 2;
}

message DecryptRequest {
  bytes session_id = 1;
  bytes crypto_state = 2;
  uint64 seq = 3;
  bytes ciphertext = 4;
}

message DecryptResponse {
  bytes plaintext = 1;
  bytes updated_crypto_state = 2;
}

message RekeyRequest {
  bytes session_id = 1;
  bytes crypto_state = 2;
}

message RekeyResponse {
  bytes updated_crypto_state = 1;
}
