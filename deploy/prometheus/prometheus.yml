global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "gateway"
    static_configs:
      - targets: ["gateway:9090"]

  - job_name: "session-manager"
    static_configs:
      - targets: ["session-manager:9091"]

  - job_name: "crypto-handler"
    static_configs:
      - targets: ["crypto-handler:9092"]

  - job_name: "dispatcher"
    static_configs:
      - targets: ["dispatcher:9093"]

  - job_name: "media-service"
    static_configs:
      - targets: ["media-service:9094"]

  - job_name: "sync-service"
    static_configs:
      - targets: ["sync-service:9095"]

  - job_name: "command-service"
    static_configs:
      - targets: ["command-service:9096"]
