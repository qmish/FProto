version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: fproto
      POSTGRES_USER: fproto
      POSTGRES_PASSWORD: fproto_dev
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fproto"]
      interval: 10s
      timeout: 5s
      retries: 3

  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3

  jaeger:
    image: jaegertracing/all-in-one:1.55
    ports:
      - "16686:16686"
      - "14250:14250"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  session-manager:
    build:
      context: ../server
      dockerfile: ../deploy/Dockerfile.session-manager
    ports:
      - "50051:50051"
    environment:
      REDIS_ADDR: redis:6379
      PG_DSN: postgres://fproto:fproto_dev@postgres:5432/fproto?sslmode=disable
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["/app/session-manager", "-redis", "redis:6379", "-pg", "postgres://fproto:fproto_dev@postgres:5432/fproto?sslmode=disable"]

  crypto-handler:
    build:
      context: ../server
      dockerfile: ../deploy/Dockerfile.crypto-handler
    ports:
      - "50052:50052"
    command: ["/app/crypto-handler", "-addr", ":50052"]

  gateway:
    build:
      context: ../server
      dockerfile: ../deploy/Dockerfile.gateway
    ports:
      - "8080:8080"
      - "8443:8443"
    depends_on:
      - session-manager
      - crypto-handler
    command: ["/app/gateway", "-ws-addr", ":8080", "-quic-addr", ":8443"]

volumes:
  redis-data:
  pg-data:
  kafka-data:
  minio-data:
