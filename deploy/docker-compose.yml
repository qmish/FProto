version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: fproto
      POSTGRES_USER: fproto
      POSTGRES_PASSWORD: fproto_dev
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fproto"]
      interval: 10s
      timeout: 5s
      retries: 3

  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3

  jaeger:
    image: jaegertracing/all-in-one:1.55
    ports:
      - "16686:16686"
      - "14250:14250"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - jaeger
      - loki

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki

  promtail:
    image: grafana/promtail:latest
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  session-manager:
    build:
      context: ../server
      dockerfile: ../deploy/Dockerfile.session-manager
    ports:
      - "50051:50051"
    environment:
      REDIS_ADDR: redis:6379
      PG_DSN: postgres://fproto:fproto_dev@postgres:5432/fproto?sslmode=disable
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["/app/session-manager", "-redis", "redis:6379", "-pg", "postgres://fproto:fproto_dev@postgres:5432/fproto?sslmode=disable", "-otlp", "jaeger:4317", "-metrics", ":9091"]

  crypto-handler:
    build:
      context: ../server
      dockerfile: ../deploy/Dockerfile.crypto-handler
    ports:
      - "50052:50052"
    command: ["/app/crypto-handler", "-addr", ":50052", "-otlp", "jaeger:4317", "-metrics", ":9092"]

  gateway:
    build:
      context: ../server
      dockerfile: ../deploy/Dockerfile.gateway
    ports:
      - "8080:8080"
      - "8443:8443"
    depends_on:
      - session-manager
      - crypto-handler
      - dispatcher
    command: ["/app/gateway", "-ws-addr", ":8080", "-quic-addr", ":8443", "-dispatcher", "dispatcher:50053", "-otlp", "jaeger:4317", "-metrics", ":9090"]

  dispatcher:
    build:
      context: ../server
      dockerfile: ../deploy/Dockerfile.dispatcher
    ports:
      - "50053:50053"
    environment:
      PG_DSN: postgres://fproto:fproto_dev@postgres:5432/fproto?sslmode=disable
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: ["/app/dispatcher", "-addr", ":50053", "-pg", "postgres://fproto:fproto_dev@postgres:5432/fproto?sslmode=disable", "-kafka", "kafka:9092", "-otlp", "jaeger:4317", "-metrics", ":9093"]

  sync-service:
    build:
      context: ../server
      dockerfile: ../deploy/Dockerfile.sync-service
    environment:
      PG_DSN: postgres://fproto:fproto_dev@postgres:5432/fproto?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      REDIS_ADDR: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      session-manager:
        condition: service_started
    command: ["/app/sync-service", "-pg", "postgres://fproto:fproto_dev@postgres:5432/fproto?sslmode=disable", "-kafka", "kafka:9092", "-redis", "redis:6379", "-push", "session-manager:50051", "-otlp", "jaeger:4317", "-metrics", ":9095"]

  media-service:
    build:
      context: ../server
      dockerfile: ../deploy/Dockerfile.media-service
    ports:
      - "50054:50054"
    environment:
      PG_DSN: postgres://fproto:fproto_dev@postgres:5432/fproto?sslmode=disable
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS: minioadmin
      MINIO_SECRET: minioadmin
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: ["/app/media-service", "-addr", ":50054", "-pg", "postgres://fproto:fproto_dev@postgres:5432/fproto?sslmode=disable", "-minio", "minio:9000", "-minio-access", "minioadmin", "-minio-secret", "minioadmin", "-otlp", "jaeger:4317", "-metrics", ":9094"]

  command-service:
    build:
      context: ../server
      dockerfile: ../deploy/Dockerfile.command-service
    environment:
      PG_DSN: postgres://fproto:fproto_dev@postgres:5432/fproto?sslmode=disable
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: ["/app/command-service", "-pg", "postgres://fproto:fproto_dev@postgres:5432/fproto?sslmode=disable", "-kafka", "kafka:9092", "-otlp", "jaeger:4317", "-metrics", ":9096"]

volumes:
  redis-data:
  pg-data:
  kafka-data:
  minio-data:
  prometheus-data:
  grafana-data:
  loki-data:
