[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fproto"
version = "0.1.0"
description = "FProto protocol SDK for Python — Noise XX handshake, AEAD encryption, session state machine"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "noiseprotocol>=0.3.1",
    "websockets>=12.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
